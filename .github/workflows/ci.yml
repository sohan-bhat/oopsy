name: ci
on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          echo "OOPS_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: Install Postgres (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@17 || true
          echo "OOPS_TEST_PG_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - name: Use the preinstalled Postgres (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OOPS_TEST_PG_BIN=$env:PGBIN" >> $env:GITHUB_ENV
      - name: Create a ReFS volume for block clone tests (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'refs.vhdx'
          @(
            "create vdisk file=`"$vhd`" maximum=4096 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=refs quick label=OopsyReFS",
            "assign letter=R"
          ) | Set-Content -Encoding ascii "$env:RUNNER_TEMP\refs.txt"
          diskpart /s "$env:RUNNER_TEMP\refs.txt"
          Get-Volume -DriveLetter R | Format-List DriveLetter, FileSystem, Size
          New-Item -ItemType Directory R:\oops-test | Out-Null
          fsutil fsinfo volumeinfo R: | Select-String 'Block Cloning|File System Name'
          echo "OOPS_TEST_REFS=R:\oops-test" >> $env:GITHUB_ENV
      - name: Install Terraform for the remote undo tests
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Start a kind cluster for the remote undo tests (Linux)
        if: runner.os == 'Linux'
        uses: helm/kind-action@v1
        with:
          cluster_name: oopsy
      - name: Install Helm (Linux)
        if: runner.os == 'Linux'
        uses: azure/setup-helm@v4
      - name: Point the remote undo tests at the cluster (Linux)
        if: runner.os == 'Linux'
        run: |
          kubectl cluster-info
          docker pull -q alpine:3.20
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          echo "OOPS_TEST_REMOTE=1" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test ./internal/... ./cmd/...
      - if: success() || failure()
        run: go test -v -timeout 40m ./e2e/
        env:
          # A 3 GB overwrite on ext4 and NTFS under the free space rule.
          OOPS_TEST_BIG: ${{ runner.os != 'macOS' && '1' || '' }}
