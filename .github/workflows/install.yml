name: install
# Installs a published release the way users do, on clean runners: Scoop and
# the PowerShell one liner on Windows, the curl one liner on Linux and macOS,
# plus pinning an older version with each.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version expected as the latest, without the v (empty: whatever is latest)"
        required: false
      pinned:
        description: "An older version to pin, without the v"
        required: false
        default: "0.2.0"

env:
  WANT: ${{ inputs.version || github.event.release.tag_name }}
  PINNED: ${{ inputs.pinned || '0.2.0' }}

jobs:
  scoop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser RemoteSigned -Force
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install Oopsy from the bucket
        shell: pwsh
        run: |
          scoop bucket add oopsy https://github.com/sohan-bhat/scoop-bucket
          scoop install oopsy/oopsy
      - name: Run it
        shell: pwsh
        run: |
          $v = oops --version
          $v
          if ($env:WANT -and $v -notmatch [regex]::Escape($env:WANT.TrimStart('v'))) { throw "expected $env:WANT" }
          oops-db --version
          oops init --only powershell,claude
          oops doctor
          New-Item -ItemType Directory demo | Out-Null
          Set-Content demo\notes.txt 'keep me'
          $env:OOPSY_LINE = 'Remove-Item -Recurse -Force demo'; $env:OOPSY_CWD = $PWD.Path
          oops hook powershell
          Remove-Item Env:OOPSY_LINE, Env:OOPSY_CWD
          Remove-Item -Recurse -Force demo
          oops -y
          if ((Get-Content demo\notes.txt) -ne 'keep me') { throw 'restore failed' }
          oops uninstall
      - name: Pin an older version
        shell: pwsh
        run: |
          scoop uninstall oopsy
          scoop install "oopsy/oopsy@$env:PINNED"
          $v = oops --version
          $v
          if ($v -notmatch [regex]::Escape($env:PINNED)) { throw "expected $env:PINNED" }

  powershell-oneliner:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        shell: [pwsh, powershell]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: irm install.ps1 | iex
        run: irm https://sohan-bhat.github.io/oopsy/install.ps1 | iex
      - name: Run it from a new shell with the user PATH
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          Get-Command oops | Format-List Source
          $v = oops --version
          $v
          if ($env:WANT -and $v -notmatch [regex]::Escape($env:WANT.TrimStart('v'))) { throw "expected $env:WANT" }
          oops doctor
      - name: Pin an older version
        run: |
          $env:OOPS_VERSION = $env:PINNED
          irm https://sohan-bhat.github.io/oopsy/install.ps1 | iex
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          $v = oops --version
          $v
          if ($v -notmatch [regex]::Escape($env:PINNED)) { throw "expected $env:PINNED" }

  curl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: curl install.sh | sh
        run: |
          curl -fsSL https://sohan-bhat.github.io/oopsy/install.sh | OOPSY_BIN_DIR="$HOME/bin" sh
          v="$("$HOME/bin/oops" --version)"
          echo "$v"
          if [ -n "$WANT" ]; then case "$v" in *"${WANT#v}"*) ;; *) echo "expected $WANT"; exit 1 ;; esac; fi
          "$HOME/bin/oops" explain rm -rf build
      - name: Pin an older version
        run: |
          curl -fsSL https://sohan-bhat.github.io/oopsy/install.sh | OOPS_VERSION="$PINNED" OOPSY_BIN_DIR="$HOME/pinned" sh
          v="$("$HOME/pinned/oops" --version)"
          echo "$v"
          case "$v" in *"$PINNED"*) ;; *) echo "expected $PINNED"; exit 1 ;; esac
