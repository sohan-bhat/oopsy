<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oopsy social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&family=Spline+Sans+Mono:wght@400;600&family=Unbounded:wght@800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f5a7b8; font-family: Figtree, sans-serif; color: #232228; overflow: hidden; }
  .card { position: relative; width: 100%; height: 100%; padding: 64px 72px; display: grid; grid-template-columns: 1fr 520px; gap: 48px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: Unbounded; font-weight: 800; font-size: 34px; letter-spacing: -.02em; }
  .brand svg { width: 66px; height: 30px; }
  h1 { margin-top: 40px; font-family: Unbounded; font-weight: 800; font-size: 82px; line-height: .98; letter-spacing: -.035em; }
  h1 code { display: inline-block; margin-top: 12px; font-family: "Spline Sans Mono"; font-weight: 600; font-size: .82em; letter-spacing: -.04em; background: #232228; color: #f5a7b8; padding: 0 .22em .06em; border-radius: .16em; transform: rotate(-2deg); }
  p.sub { margin-top: 30px; font-size: 26px; font-weight: 500; line-height: 1.35; max-width: 20em; }
  .term { background: #232228; color: #ebe9f0; border: 2px solid #232228; border-radius: 20px; box-shadow: 10px 10px 0 rgba(35,34,40,.9); font-family: "Spline Sans Mono"; font-size: 21px; line-height: 1.75; padding: 30px 32px; }
  .p { color: #f7b6c4; margin-right: 12px; }
  .y { color: #f6c531; }
  .g { color: #a9e2b8; }
  .d { color: #9c9aa6; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand"><svg viewBox="0 0 44 20"><rect x="1" y="2" width="16" height="16" rx="5" fill="#F5A7B8" stroke="#232228" stroke-width="2"/><rect x="15" y="2" width="8" height="16" fill="#C8CAD0" stroke="#232228" stroke-width="2"/><path d="M23 2h15l5 8-5 8H23z" fill="#F6C531" stroke="#232228" stroke-width="2" stroke-linejoin="round"/></svg>oopsy</div>
    <h1>Undo almost<br><code>anything</code>.</h1>
    <p class="sub">For you and your AI agents. Files and Postgres.</p>
  </div>
  <div class="term">
    <div><span class="p">$</span>rm -rf src</div>
    <div><span class="y">oopsy</span> <span class="d">saved 3 files as snapshot</span> <span class="y">42</span></div>
    <div><span class="p">$</span>ls src</div>
    <div class="d">ls: src: No such file</div>
    <div><span class="p">$</span>oops</div>
    <div><span class="g">restored</span> 3 files <span class="d">from snapshot</span> <span class="y">42</span></div>
    <div><span class="p">$</span><span class="d">phew</span></div>
  </div>
</div>
</body>
</html>
